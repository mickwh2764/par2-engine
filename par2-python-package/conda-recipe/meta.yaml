{% set name = "par2-circadian" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/par2_circadian-{{ version }}.tar.gz
  sha256: 059a4ff84d9346d7fde5a5c23437c7357b5bf7f292994c8a5e99959a94c54512

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - par2 = par2.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=64
    - wheel
  run:
    - python >=3.9
    - numpy >=1.20
    - pandas >=1.3

test:
  imports:
    - par2
    - par2.core
    - par2.hierarchy
    - par2.metrics
    - par2.io
  commands:
    - par2 --help

about:
  home: https://github.com/mickwh2764/par2discovery
  summary: AR(2) eigenvalue analysis for gene expression time series
  description: |
    Fits second-order autoregressive models to gene expression data and
    computes the eigenvalue modulus |λ|, a single number that quantifies
    temporal persistence. Discovers the three-layer hierarchy:
    Clock > Target > Background.
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  doc_url: https://github.com/mickwh2764/par2discovery#readme
  dev_url: https://github.com/mickwh2764/par2discovery

extra:
  recipe-maintainers:
    - mickwh2764
